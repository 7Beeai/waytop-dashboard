# /etc/nginx/sites-available/waytop.7bee.ai  (ln -s em sites-enabled)
# Depois: sudo certbot --nginx -d waytop.7bee.ai
server {
    listen 80;
    server_name waytop.7bee.ai;
    root /var/www/html/waytop.7bee.ai;
    index index.html;
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate" always; }
    location / { try_files $uri $uri/ /index.html; }
    # Conector Instagram (deploy/instagram/server.js)
    location /api/ig/ { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
}
